name: PfandWeitergeben
options:
  bundleIdPrefix: de.pfandweitergeben
  developmentLanguage: de
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  PfandWeitergeben:
    type: application
    platform: iOS
    sources:
      - path: PfandWeitergeben
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.pfandweitergeben.app
        DEVELOPMENT_TEAM: 92CZFFF7NY
        PRODUCT_NAME: PfandWeitergeben
        INFOPLIST_FILE: PfandWeitergeben/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - PfandWeitergebenTests
      gatherCoverageData: true
  PfandWeitergebenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PfandWeitergebenTests
    dependencies:
      - target: PfandWeitergeben
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.pfandweitergeben.tests
        GENERATE_INFOPLIST_FILE: YES
